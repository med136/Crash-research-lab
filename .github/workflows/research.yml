name: Reproducible Historical Research (Paper Only)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/research.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run every Python unit test
        run: python -m unittest discover -s tests -v
      - name: Fetch pinned public BTC research data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data reports
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://raw.githubusercontent.com/jptrustlearning/btc/37f72830f8267e05b651515e8c3c263ef057d8e7/btc_prices.csv \
            --output data/btc_source.csv
          echo "e633106c023e80f48e404574952ed7b1f8bfe650  data/btc_source.csv" > data/git_blob_expected.txt
          ACTUAL="$(git hash-object data/btc_source.csv)"
          test "$ACTUAL" = "e633106c023e80f48e404574952ed7b1f8bfe650"
          python -c "from cryptolab.import_daily import import_daily; print(import_daily('data/btc_source.csv','data/btc_daily.csv'))"
      - name: Smoke-test official Binance BTC/ETH daily archives with checksums
        run: |
          python -m cryptolab.binance_bulk --symbol BTCUSDT --start 2025-01 --end 2025-01 --output data/btc_official_sample.csv > reports/binance_btc_manifest.json
          python -m cryptolab.binance_bulk --symbol ETHUSDT --start 2025-01 --end 2025-01 --output data/eth_official_sample.csv > reports/binance_eth_manifest.json
      - name: Offline daily volatility paper wallet restart test (NO live orders)
        shell: bash
        run: |
          set -euo pipefail
          python -m cryptolab.cli paper-vol --symbol BTCUSDT --state data/btc_virtual_wallet.json --input data/btc_daily.csv > reports/paper_first.json
          python -m cryptolab.cli paper-vol --symbol BTCUSDT --state data/btc_virtual_wallet.json --input data/btc_daily.csv > reports/paper_second.json
          cmp reports/paper_first.json reports/paper_second.json
          python -c "import json; p=json.load(open('reports/paper_second.json')); assert p['paper_only'] is True and p['executions']==0 and p['source']=='csv_replay'"
      - name: Evaluate 15 crypto markets and render static research panel
        shell: bash
        run: |
          set -euo pipefail
          python -m cryptolab.universe \
            --symbols BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT,AVAXUSDT,DOTUSDT,LTCUSDT,TRXUSDT,BCHUSDT,ATOMUSDT,NEARUSDT \
            --end 2026-09-30 --bars 1000 --first 450 --days 90 --min-success 12 \
            --output reports/universe_15.json --panel reports/universe_panel.html
          python -c "import json; d=json.load(open('reports/universe_15.json')); assert len(d['symbols_requested'])==15 and d['successful_symbols']>=12 and d['deployment_gate']=='NO_REAL_ORDERS'"
      - name: Evaluate 5m 15m 1h 4h on six major spot pairs
        shell: bash
        run: |
          set -euo pipefail
          python -m cryptolab.timeframes \
            --symbols BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT \
            --frames 5m,15m,1h,4h --end 2026-09-30 --bars 1000 \
            --first 450 --window 90 --min-success 20 \
            --output reports/timeframes_24.json --panel reports/timeframes_panel.html
          python -c "import json; r=json.load(open('reports/timeframes_24.json')); assert r['successful_markets']>=20 and r['deployment_gate']=='NO_REAL_ORDERS'; assert set(r['frames_requested'])=={'5m','15m','1h','4h'}"
          python -c "from pathlib import Path; h=Path('reports/timeframes_panel.html').read_text(); assert 'locale-fr' in h and 'locale-en' in h and 'lang=\"fr\"' in h"
      - name: Paired BTC strategy comparison (not deployable)
        run: python -m cryptolab.cli paired --input data/btc_daily.csv > reports/paired.json
      - name: Adverse costs and sign-test diagnostic
        run: python -m cryptolab.cli audit --input data/btc_daily.csv > reports/cost_audit.json
      - name: Expanding-window walk-forward diagnostic
        run: python -m cryptolab.cli walk-forward --input data/btc_daily.csv > reports/walk_forward.json
      - name: Store research results (including when validation fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-research-no-orders
          path: |
            reports/*.json
            reports/*.html
          retention-days: 14
          if-no-files-found: warn
