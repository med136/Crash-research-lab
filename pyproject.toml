[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "crypto-ai-trading-lab"
version = "0.1.0"
requires-python = ">=3.10"
description = "Paper-only crypto research and chronological backtesting"
[project.scripts]
cryptolab = "cryptolab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
